{% extends "layout.html" %}

{% block content %}
<h2>Given input is {{number}}</h2>
{% if number == 0 %}
    <p>The given input {{number}} is neither odd nor even!!</p>
{% elif number % 2==0%}
    <p>The given input {{number}} is even!!</p>
{% else %}
    <p>The given input {{number}} is odd!!</p>
{% endif %}
{% endblock content %}
